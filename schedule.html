 <div class="calendar-widget">
        <div class="calendar-header">
            <button class="nav-btn" id="prevMonth">&lsaquo;</button>
            <div class="current-month" id="monthDisplay"></div>
            <button class="nav-btn" id="nextMonth">&rsaquo;</button>
        </div>
        <div class="weekdays">
            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
        </div>
        <div class="days-grid" id="daysContainer"></div>
    </div>

    <script>
        const monthDisplay = document.getElementById('monthDisplay');
        const daysContainer = document.getElementById('daysContainer');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');

        const months = [
            "January", "February", "March", "April", "May", "June", 
            "July", "August", "September", "October", "November", "December"
        ];

        let date = new Date();
        let currentYear = date.getFullYear();
        let currentMonth = date.getMonth();

        function renderCalendar() {
            daysContainer.innerHTML = "";
            
            // Set header text
            monthDisplay.innerText = `${months[currentMonth]} ${currentYear}`;

            // First day of the current month
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            // Last day of the current month
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Render empty slots for padding before the 1st of the month
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('day', 'empty');
                daysContainer.appendChild(emptyDiv);
            }

            // Render the days of the month
            const today = new Date();
            for (let day = 1; day <= lastDay; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.innerText = day;

                // Highlight today's real-time date
                if (
                    day === today.getDate() && 
                    currentMonth === today.getMonth() && 
                    currentYear === today.getFullYear()
                ) {
                    dayDiv.classList.add('today');
                }

                daysContainer.appendChild(dayDiv);
            }
        }

        prevBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        });

        renderCalendar();
    </script>
